name: Verificar y publicar en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verificar motor, parser, validación, servidor y generador
        run: python -B -m unittest discover -s tests -t . -v
      - name: Comprobar sintaxis de JavaScript
        run: |
          for file in frontend/js/*.js; do node --check "$file"; done
      - name: Comprobar transporte y recuperación de errores del worker
        run: node --test tests/deploy/test_browser_api.mjs
      - name: Construir sitio estático
        run: python -B scripts/build_pages.py
      - name: Preparar Python WebAssembly para comprobar la publicación
        run: npm install --prefix "$RUNNER_TEMP/pages-runtime" --no-audit --no-fund pyodide@314.0.8
      - name: Comprobar ejemplos en Python WebAssembly real
        env:
          PYODIDE_MODULE_PATH: ${{ runner.temp }}/pages-runtime/node_modules/pyodide/pyodide.mjs
        run: node tests/deploy/test_pyodide.mjs
      - name: Preparar Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Guardar artefacto público
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar evaluador
        id: deployment
        uses: actions/deploy-pages@v4
